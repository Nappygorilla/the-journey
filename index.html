<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07110d" />
    <meta name="description" content="The Journey — Scripture, prayer, learning, and growth, completely free." />
    <title>The Journey — Grow in faith. Grow in Scripture.</title>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-fallback"
        style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#06100c;color:#f2f5f1;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center"
      >
        <div>
          <div style="font-size:34px;margin-bottom:12px">✝</div>
          <h1 style="margin:0 0 8px;font-size:28px">The Journey</h1>
          <p style="margin:0;color:#93a099">Loading your Scripture and faith tools…</p>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("journey-react-started", () => {
        document.documentElement.dataset.journeyReactStarted = "1";
      });
      window.setTimeout(() => {
        if (document.documentElement.dataset.journeyReactStarted === "1") return;
        const babel = document.createElement("script");
        babel.src = "https://unpkg.com/@babel/standalone@7.26.10/babel.min.js";
        babel.onload = () => {
          const react = document.createElement("script");
          react.src = "https://unpkg.com/react@18.3.1/umd/react.production.min.js";
          react.onload = () => {
            const dom = document.createElement("script");
            dom.src = "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js";
            dom.onload = () => {
              const app = document.createElement("script");
              app.type = "text/babel";
              app.setAttribute("data-presets", "react");
              app.src = "./legacy-app.jsx";
              document.body.appendChild(app);
            };
            document.body.appendChild(dom);
          };
          document.body.appendChild(react);
        };
        document.body.appendChild(babel);
      }, 1200);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
