<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07110d" />
    <meta name="description" content="The Journey — Scripture, prayer, learning, and growth, completely free." />
    <title>The Journey — Grow in faith. Grow in Scripture.</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#06100c;color:#f2f5f1;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center">
        <div>
          <div style="font-size:34px;margin-bottom:12px">✝</div>
          <h1 style="margin:0 0 8px;font-size:28px">The Journey</h1>
          <p id="boot-message" style="margin:0;color:#93a099">Loading your Scripture and faith tools…</p>
          <div id="boot-error" style="display:none;max-width:560px;margin:18px auto 0;color:#e8b0b0;font-size:14px;line-height:1.6">
            <strong>The Journey could not start.</strong>
            <p id="boot-error-detail" style="margin:8px 0 14px"></p>
            <button type="button" onclick="location.reload()" style="border:1px solid rgba(213,187,114,.35);background:#151b16;color:#f3e7b0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer">Reload</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        let reactStarted = false;
        let fallbackStarted = false;
        const root = document.getElementById("root");
        const message = document.getElementById("boot-message");
        const errorBox = document.getElementById("boot-error");
        const errorDetail = document.getElementById("boot-error-detail");

        window.addEventListener("journey-react-started", () => {
          reactStarted = true;
          document.documentElement.dataset.journeyReactStarted = "1";
        });

        const showError = (error) => {
          if (reactStarted) return;
          message.textContent = "Startup failed.";
          errorBox.style.display = "block";
          errorDetail.textContent = error?.message || String(error || "Unknown startup error");
          console.error("The Journey fallback startup failed:", error);
        };

        const addScript = (src) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Could not load " + src));
          document.head.appendChild(script);
        });

        const startLegacy = async () => {
          if (reactStarted || fallbackStarted) return;
          fallbackStarted = true;
          try {
            await addScript("https://unpkg.com/@babel/standalone@7.26.10/babel.min.js");
            await addScript("https://unpkg.com/react@18.3.1/umd/react.production.min.js");
            await addScript("https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js");

            const response = await fetch("./legacy-app.js", { cache: "no-store" });
            if (!response.ok) throw new Error("Could not load fallback application (" + response.status + ").");
            const source = await response.text();
            const transformed = Babel.transform(source, { presets: ["react"] });
            if (!transformed?.code) throw new Error("Fallback application transpilation returned no code.");

            const boot = new Function(
              "React",
              "ReactDOM",
              "window",
              "document",
              "localStorage",
              "fetch",
              transformed.code + "\n//# sourceURL=legacy-app.js"
            );
            boot(window.React, window.ReactDOM, window, document, window.localStorage, window.fetch.bind(window));
          } catch (error) {
            showError(error);
          }
        };

        window.setTimeout(() => {
          if (!reactStarted) startLegacy();
        }, 1500);
      })();
    </script>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
