name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "journey-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Feature audit
        run: npm run audit:features
      - name: Deep source audit
        run: node scripts/deep-audit.mjs
      - name: Build
        run: npm run build
      - name: Install browser smoke-test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/runtime-smoke.mjs
      - name: Branch Pages fallback smoke test
        run: node scripts/branch-fallback-smoke.mjs
