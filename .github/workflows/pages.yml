name: Retire duplicate Journey deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "journey-pages"
  cancel-in-progress: true

# GitHub Pages currently publishes the main branch directly. A second
# Vite deploy workflow can race that publisher and overwrite newer UI.
# Keep this trigger only to cancel any older runs from the retired workflow.
jobs:
  retired-deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "The branch-based Pages publisher is the source of truth."
